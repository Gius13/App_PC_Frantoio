name: Test interfaccia e archivio frantoio

on:
  push:
    branches:
      - feature/modern-ui-record-editing
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app_frantoio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install --upgrade pip PyQt6 requests pandas openpyxl tzdata
      - name: Run model, SQLite and calendar tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s app_frantoio/tests -v
