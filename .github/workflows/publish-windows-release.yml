name: Pubblica installer Frantoio v0.2.2 su GitHub Releases

on:
  workflow_dispatch:
  push:
    branches:
      - feature/modern-ui-record-editing
    paths:
      - .github/workflows/publish-windows-release.yml

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica installer Windows gia testato da GitHub Actions
        uses: actions/download-artifact@v4
        with:
          name: App-Frantoio-Installer-Windows-x64
          run-id: 42264789753
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: installer

      - name: Verifica eseguibile, istruzioni e impronta SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          directory = Path('installer')
          setup = directory / 'Setup_App_Frantoio.exe'
          checksum = directory / 'SHA256.txt'
          instructions = directory / 'ISTRUZIONI.txt'
          for file in (setup, checksum, instructions):
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f'File mancante o vuoto: {file}')
          expected = checksum.read_text(encoding='utf-8-sig').strip().split()[0].lower()
          sha = hashlib.sha256(setup.read_bytes()).hexdigest().lower()
          if sha != expected:
              raise SystemExit('SHA256 dell installer NON valido')
          print('Installer valido:', setup.name, 'bytes:', setup.stat().st_size, 'sha256:', sha)
          PY

      - name: Genera note ufficiali della versione
        shell: bash
        run: |
          cat > NOTE_RELEASE.md <<'EOF'
          ## App Frantoio v0.2.2 — Anteprima Windows 64 bit

          Installer completo **Setup_App_Frantoio.exe** per Windows 10/11 a 64 bit.
          Correzione del pulsante **Applica pagamento**:
          - il valore compare immediatamente sulla riga;
          - polling e sincronizzazioni non ignorano i clic;
          - salvataggi falliti ripristinano il valore precedente;
          - le risposte obsolete Firebase non sovrascrivono le modifiche.

          Mantiene interfaccia chiaro/scuro, filtri multi-giorno,
          selettori con frecce rosse e rinnovo sessione Firebase.

          **Prima di installare:** chiudere la vecchia versione ed effettuare
          una copia di sicurezza dell'archivio SQLite e di
          `%APPDATA%\App_Frantoio\config.json`.

          Installare preferibilmente nella cartella della versione precedente.
          L'installer non cancella database o configurazione, ma un archivio
          SQLite con percorso relativo potrebbe trovarsi in una cartella diversa.
          Controllare la destinazione in fase d'installazione.

          Questa e una versione **pre-release** del branch di sviluppo:
          il comportamento e stato verificato da 47 test su Windows e da una
          installazione automatica, ma resta da collaudare sul database reale.

          Per controllare l'integrita dell'installer usare `SHA256.txt`.

          Build verificata: [GitHub Actions 42264789753](https://github.com/Gius13/App_PC_Frantoio/actions/runs/42264789753).
          Commit sorgente: `6ecf7b51f31e1fc85857f56149c9365928182028`.
          EOF

      - name: Pubblica prerelease con i file dell installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Gius13/App_PC_Frantoio
        shell: bash
        run: |
          gh release create v0.2.2-beta.1 \
            installer/Setup_App_Frantoio.exe \
            installer/SHA256.txt \
            installer/ISTRUZIONI.txt \
            --target 6ecf7b51f31e1fc85857f56149c9365928182028 \
            --title 'App Frantoio v0.2.2 (Windows - Beta)' \
            --notes-file NOTE_RELEASE.md \
            --prerelease

      - name: Conferma disponibilita della release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Gius13/App_PC_Frantoio
        shell: bash
        run: |
          gh release view v0.2.2-beta.1 --json url,assets --jq '.url, (.assets[].name)'
